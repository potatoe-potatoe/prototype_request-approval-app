name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - 'chore/github-pages-deploy' # Use quotes for slashes
  workflow_dispatch:                # Enables the manual "Run" button

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    working-directory: client       # GitHub Actions need this info

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Angular
        uses: bitovi/github-actions-angular-to-github-pages@v1.2.0
        with:
          path: client/dist/client/browser              # Build output path
          base-href: /prototype_request-approval-app/   # Repo name
          project_directory: client                     # Bitovi needs this info
