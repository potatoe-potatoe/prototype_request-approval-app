name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - 'chore/github-pages-deployment' # Use quotes for slashes
  workflow_dispatch:                    # Enables the manual "Run" button

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Angular
        uses: bitovi/github-actions-angular-to-github-pages@v1.0.0
        with:
          path: client/dist/client/browser
          install_command: cd client && npm ci
          build_command: cd client && npm run build -- --base-href=/${{ github.event.repository.name }}/
