<div class="navbar bg-base-100 shadow-sm z-10 px-6">
  <div class="flex-1">
    <span class="text-xl font-bold">Approval Checklist</span>
  </div>
  <div class="flex-none flex items-center gap-6">
    <label class="flex items-center gap-1.5 cursor-pointer select-none">
      <!-- sun heroicon (outline) -->
      @if (themeService.theme() === THEME.Light) {
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
        </svg>
      } @else {
        <!-- moon heroicon (solid) -->
        <svg class="w-5.5 h-5.5" viewBox="0 0 24 24" fill="currentColor">
          <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd"/>
        </svg>
      }
      <app-toggle
        [checked]="themeService.theme() === THEME.Dark"
        (checkedChange)="toggleTheme()"
      />
    </label>
    <div class="avatar avatar-placeholder cursor-pointer">
      <div class="bg-neutral text-neutral-content w-10 rounded-full">
        <span>U</span>
      </div>
    </div>
  </div>
</div>
