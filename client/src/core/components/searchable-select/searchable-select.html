<button #dropdown type="button"
  [class]="'select select-bordered cursor-pointer w-full flex items-center text-left' + (size() === 'sm' ? ' select-sm' : '')"
  (click)="open(dropdown)">
  @if (value()) {
    <span class="truncate min-w-0">{{ value() }}</span>
  } @else {
    <span class="truncate min-w-0 text-base-content/40">{{ placeholder() }}</span>
  }
</button>
@if (isOpen()) {
  <div
    class="cursor-pointer z-50 bg-base-100 rounded-box border border-base-300 shadow p-1 flex flex-col gap-0.5"
    [style]="panelStyle()"
  >
    <div class="px-0.5 pb-0.5">
      <input type="text"
        [class]="'input input-bordered w-full' + (size() === 'sm' ? ' input-sm' : '')"
        placeholder="Search"
        [value]="search()"
        (input)="search.set($any($event.target).value)" />
    </div>
    <ul class="max-h-46 overflow-y-auto">
      @for (option of filteredOptions; track option) {
        <li>
          <button type="button"
            class="w-full cursor-pointer flex items-center gap-1.5 px-3 py-2 text-sm rounded-btn hover:bg-base-300"
            (click)="select(option)">
            <svg class="w-4 h-4 shrink-0 text-primary" [class.invisible]="value() !== option"
              viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m4.5 12.75 6 6 9-13.5"/>
            </svg>
            <span>{{ option }}</span>
          </button>
        </li>
      }
      @empty {
        <li class="px-3 py-2 text-sm text-base-content/40">No results</li>
      }
    </ul>
  </div>
}
