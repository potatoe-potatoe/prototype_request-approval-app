<div class="bg-base-200 rounded-lg px-3 py-2.5 flex flex-col gap-2" [formGroup]="commentGroup">
  <textarea
    class="textarea textarea-bordered bg-base-100 w-full resize-none"
    rows="5"
    placeholder="Enter comment here"
    formControlName="text"
  ></textarea>
  <hr class="border-base-300">
  <div class="flex flex-col gap-0.5">
    <span class="text-xs font-semibold text-base-content/50 mb-1">References</span>
    @for (ref of commentGroup.controls.references.value; track ref.label; let i = $index) {
      <div class="flex items-center gap-0.5 pl-1.5 rounded-md hover:bg-base-300/60">
        <a class="link link-primary text-xs flex-1 min-w-0 truncate" [href]="ref.url" target="_blank">{{ ref.label }}</a>
        <button class="btn btn-ghost btn-xs btn-square text-base-content/40 hover:text-base-content/70" (click)="editReference(i)">
          <!-- pencil-square heroicon (outline) -->
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/>
          </svg>
        </button>
        <button class="btn btn-ghost btn-xs btn-square text-base-content/40 hover:text-base-content/70" (click)="removeReference(i)">✕</button>
      </div>
    }
    <div class="flex gap-2 mt-1">
      <input
        type="text"
        class="input input-bordered input-sm bg-base-100 flex-1 min-w-0"
        placeholder="Reference name"
        [value]="newRefLabel()"
        (input)="newRefLabel.set($any($event.target).value)"
      />
      <input
        type="text"
        class="input input-bordered input-sm bg-base-100 flex-2 min-w-0"
        placeholder="URL"
        [value]="newRefUrl()"
        (input)="newRefUrl.set($any($event.target).value)"
      />
      @if (editingRefIndex() !== null) {
        <button class="btn btn-outline btn-sm shrink-0" (click)="cancelEditReference()">Cancel</button>
      }
      <button class="btn btn-outline btn-primary btn-sm shrink-0" [disabled]="!newRefLabel().trim() || !newRefUrl().trim()" (click)="addReference()">
        {{ editingRefIndex() !== null ? 'Update' : '+ Add' }}
      </button>
    </div>
  </div>
</div>
