<div class="flex flex-col gap-2">
  <div class="flex items-center gap-3">
    <!-- Status filter selection -->
    @if (showStatusFilter()) {
      <div class="dropdown">
        <button tabindex="0" class="btn btn-ghost border border-base-300 w-36 justify-between">
          Status
          @if (allStatusSelected()) {
            <span class="badge badge-primary badge-sm">All</span>
          } @else if (someStatusSelected()) {
            <span class="badge badge-primary badge-sm">{{ selectedStatuses().length }}</span>
          }
          <!-- chevron-down heroicon (outline) -->
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.5 8.25L12 15.75L4.5 8.25"/>
          </svg>
        </button>
        <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box shadow border border-base-300 z-10 w-48 p-1 mt-1">
          <li>
            <label class="flex items-center gap-2 cursor-pointer px-3 py-2">
              <input type="checkbox" class="checkbox checkbox-primary checkbox-sm"
                [checked]="allStatusSelected()"
                [indeterminate]="someStatusSelected()"
                (change)="toggleAll()" />
              <span class="text-sm font-medium">All</span>
            </label>
          </li>
          <li class="border-t border-base-300 my-1 p-0"></li>
          @for (status of statusOptions(); track status) {
            <li>
              <label class="flex items-center gap-2 cursor-pointer px-3 py-2">
                <input type="checkbox" class="checkbox checkbox-primary checkbox-sm" [checked]="isSelectedStatus(status)" (change)="toggleStatus(status)" />
                <span class="text-sm">{{ status }}</span>
              </label>
            </li>
          }
        </ul>
      </div>
     }

    <!-- Text search filter -->
    <input type="text" placeholder="Search by: Control#, Vendor, or Subject" class="input input-bordered flex-1" [value]="searchText()" (input)="onSearchInput($event)" />

    <button class="btn btn-primary" (click)="apply()">
      <!-- funnel heroicon (outline) -->
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 01-.659 1.591l-5.432 5.432a2.25 2.25 0 00-.659 1.591v2.927a2.25 2.25 0 01-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 00-.659-1.591L3.659 7.409A2.25 2.25 0 013 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0112 3z"/>
      </svg>
      Apply
    </button>

    <button class="btn btn-outline" (click)="reset()">
      <!-- arrow-path heroicon (outline) -->
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/>
      </svg>
      Reset
    </button>
  </div>

  <!-- Active filter badges row -->
  @if (showStatusFilter()) {
    @if (someStatusSelected()) {
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs text-base-content/50">Selected filters:</span>
        @for (status of selectedStatuses(); track status) {
          <span class="badge badge-sm bg-base-300 text-base-content/70 border-0 text-xs">Status - {{ status }}</span>
        }
      </div>
    }
  }
</div>
