<div class="flex flex-col gap-4 p-6 h-full">
  <!-- Title -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold">All Requests</h1>
    <p class="text-base-content/60">View all submitted requests, including rejected and cancelled items.</p>
  </div>

  <!-- Filters -->
  <app-requests-table-filters
    [statusOptions]="statusOptions"
    [(searchText)]="pendingSearchText"
    [(selectedStatuses)]="pendingStatusList"
    (filtersApplied)="onFiltersApplied($event)"
    (filtersReset)="onFiltersReset()"/>

  <app-requests-table
    [requests]="requests()"
    [currentPage]="pagination().currentPage"
    [totalPages]="pagination().totalPages"
    [pageSize]="pagination().pageSize"
    [totalItems]="pagination().totalItems"
    (pageChange)="changePage($event)"
    (pageSizeChange)="changePageSize($event)"/>
</div>
