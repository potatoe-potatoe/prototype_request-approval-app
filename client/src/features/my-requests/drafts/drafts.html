<div class="flex flex-col gap-4 p-6 h-full">
  <!-- Title -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold">My Draft Requests</h1>
    <p class="text-base-content/60">Review your draft requests before submitting them for approval.</p>
  </div>

  <!-- Filters -->
  <app-requests-table-filters/>

  <!-- COntent -->
  <app-requests-table
    [requests]="requests()"
    [currentPage]="paginationData().currentPage"
    [totalPages]="paginationData().totalPages"
    [pageSize]="paginationData().pageSize"
    [totalItems]="paginationData().totalItems"/>
</div>
