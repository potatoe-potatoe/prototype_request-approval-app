<div class="flex flex-col gap-4 p-6 h-full">
  <!-- Title -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold">My Submitted Requests</h1>
    <p class="text-base-content/60">View all your submitted requests here, including those pending approval.</p>
  </div>

  <!-- Filters -->
  <div class="flex items-center gap-3">
    <input type="text" placeholder="Search by: Control#, Vendor, or Subject" class="input input-bordered flex-1" />
    <button class="btn btn-primary">Apply</button>
  </div>

  <app-requests-table
    [requests]="requests()"
    [currentPage]="paginationData().currentPage"
    [totalPages]="paginationData().totalPages"
    [pageSize]="paginationData().pageSize"
    [totalItems]="paginationData().totalItems"/>
</div>
